<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative subtle background circles -->
  <circle cx="1050" cy="120" r="320" fill="#10B981" opacity="0.08"/>
  <circle cx="150" cy="550" r="260" fill="#34D399" opacity="0.06"/>
  <circle cx="950" cy="480" r="180" fill="#F59E0B" opacity="0.05"/>

  <!-- Left Content Container -->
  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect width="360" height="42" rx="21" fill="url(#badge-bg)" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#A7F3D0" letter-spacing="1.5">
      🌿 AUTHENTIC BOTANICAL DISPENSARY
    </text>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      THANGAM STORES
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#D1FAE5" letter-spacing="0">
      Authentic Natural Healthcare &amp; Herbal Remedies
    </text>

    <!-- Value Propositions -->
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
      ✓ Pure botanical Ayurvedic extracts &amp; classical preparations
    </text>
    <text x="0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
      ✓ Click &amp; Collect with 6-digit pickup verification
    </text>
    <text x="0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
      ✓ Zero advance online payment — inspect &amp; pay at counter
    </text>

    <!-- Bottom URL pill -->
    <g transform="translate(0, 395)">
      <rect width="420" height="48" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#6EE7B7">
        ecommerce-storefront-client.vercel.app
      </text>
    </g>
  </g>

  <!-- Right Logo Emblem -->
  <g transform="translate(850, 180)">
    <circle cx="130" cy="130" r="130" fill="#065F46" stroke="#34D399" stroke-width="3" stroke-opacity="0.3"/>
    <circle cx="130" cy="130" r="110" fill="#047857"/>
    <!-- Leaf motif -->
    <path d="M70 180 C70 120 125 80 170 80 C170 125 130 180 70 180 Z" fill="#34D399"/>
    <path d="M70 180 C105 145 135 115 170 80" stroke="#064E3B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="170" cy="180" r="45" fill="#059669" stroke="#ECFDF5" stroke-width="5"/>
    <path d="M170 155 V205 M145 180 H195" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
