plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thangamstores.app'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions = ["appType"]
    productFlavors {
        storefront {
            dimension "appType"
            applicationId "com.thangamstores.app"
            buildConfigField "String", "START_URL", "\"https://ecommerce-storefront-client.vercel.app\""
            buildConfigField "String", "START_HOST", "\"ecommerce-storefront-client.vercel.app\""
            buildConfigField "boolean", "IS_ADMIN", "false"
        }
        admin {
            dimension "appType"
            applicationId "com.thangamstores.admin"
            buildConfigField "String", "START_URL", "\"https://ems-admin-portal.vercel.app\""
            buildConfigField "String", "START_HOST", "\"ems-admin-portal.vercel.app\""
            buildConfigField "boolean", "IS_ADMIN", "true"
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Custom Tabs — enables Google Sign-in to work correctly inside the app
    implementation 'androidx.browser:browser:1.8.0'
}
